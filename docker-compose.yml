version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skripsi_postgres
    environment:
      POSTGRES_USER: skripsi_user
      POSTGRES_PASSWORD: skripsi_password
      POSTGRES_DB: skripsi_chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: skripsi_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
